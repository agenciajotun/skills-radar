<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>Skills Radar — Feed de dados</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000;
      --surface: #0e100e;
      --border: rgba(255, 255, 255, 0.12);
      --text: rgba(255, 255, 255, 0.95);
      --muted: rgba(255, 255, 255, 0.68);
      --accent: #c8ff00;
    }

    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
    }

    main {
      width: min(100%, 680px);
      padding: clamp(28px, 6vw, 48px);
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
    }

    .label {
      display: inline-block;
      margin-bottom: 20px;
      color: var(--accent);
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 18px;
      font-size: clamp(2rem, 7vw, 3.75rem);
      line-height: 1;
      letter-spacing: -0.05em;
    }

    p { margin: 0 0 18px; color: var(--muted); }
    p:last-child { margin-bottom: 0; }

    code {
      padding: 0.18em 0.42em;
      border-radius: 5px;
      background: rgba(200, 255, 0, 0.1);
      color: var(--accent);
      font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
      font-size: 0.9em;
      overflow-wrap: anywhere;
    }

    strong { color: var(--text); }
  </style>
</head>
<body>
  <main>
    <span class="label">Skills Radar</span>
    <h1>Feed diário de dados.</h1>
    <p>Este repositório alimenta a aba <strong>Skills em Alta</strong> do produto. Os dados publicados vivem em <code>data/trending.json</code>.</p>
    <p>A coleta roda diariamente pelo GitHub Actions e consulta duas fontes: <strong>GitHub Search API</strong> e <strong>Hacker News Algolia</strong>.</p>
  </main>
</body>
</html>
